html_code = """<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haftalik Dars Jadvali Generator</title>
    <!-- Rasmga olish uchun html2canvas kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Shriftlar -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .toolbar {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .btn-download {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
            transition: 0.2s;
        }

        .btn-download:hover {
            background-color: #1d4ed8;
        }

        /* Asosiy jadval maydoni (Rasmga tushadigan qism) */
        .capture-area {
            background-color: #f0f4f8;
            padding: 40px;
            width: 1200px;
            box-sizing: border-box;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 5px 0;
            outline: none;
            border-bottom: 1px dashed transparent;
        }

        .header-title:focus {
            border-bottom: 1px dashed #94a3b8;
        }

        .header-subtitle {
            font-size: 13px;
            color: #0284c7;
            font-weight: 600;
            margin: 0 0 25px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: #ffffff;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 16px;
            text-align: left;
            vertical-align: top;
            width: calc(100% / 8);
        }

        th {
            font-weight: 500;
            color: #475569;
            font-size: 13px;
            padding-bottom: 16px;
        }

        .juftlik-col {
            color: #475569;
            font-size: 13px;
            font-weight: 400;
        }

        td.editable-cell {
            cursor: pointer;
            transition: background 0.2s;
            height: 100px;
        }

        td.editable-cell:hover {
            background: #f8fafc;
        }

        .subject {
            font-weight: 600;
            font-size: 13px;
            color: #0f172a;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .time {
            font-size: 12px;
            color: #0369a1;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .room, .teacher {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 3px;
            line-height: 1.3;
        }
        .empty {
            color: #cbd5e1;
            font-size: 13px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .modal h3 { margin-top: 0; margin-bottom: 15px; color: #1e293b; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #475569; font-weight: 500;}
        .form-group input { 
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; 
            border-radius: 6px; box-sizing: border-box; font-family: 'Inter', sans-serif; 
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-save { background: #10b981; color: white; }
        .btn-cancel { background: #e2e8f0; color: #475569; }
        .btn-clear { background: #ef4444; color: white; margin-right: auto; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-download" onclick="downloadPNG()">↓ PNG formatida yuklab olish</button>
    </div>

    <div id="capture-area" class="capture-area">
        <h1 class="header-title" contenteditable="true" spellcheck="false">XTA-26/5</h1>
        <h2 class="header-subtitle">HAFTALIK DARS JADVALI</h2>

        <table>
            <thead>
                <tr>
                    <th>Juftlik</th>
                    <th>Dushanba</th>
                    <th>Seshanba</th>
                    <th>Chorshanba</th>
                    <th>Payshanba</th>
                    <th>Juma</th>
                    <th>Shanba</th>
                    <th>Yakshanba</th>
                </tr>
            </thead>
            <tbody id="schedule-body">
            </tbody>
        </table>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Darsni kiritish</h3>
            <div class="form-group">
                <label>Fan nomi (va turi)</label>
                <input type="text" id="m-subject" placeholder="Masalan: Kelajak soati">
            </div>
            <div class="form-group">
                <label>Vaqti</label>
                <input type="text" id="m-time" placeholder="09:00 - 10:20">
            </div>
            <div class="form-group">
                <label>Xona</label>
                <input type="text" id="m-room" placeholder="Masalan: B-607">
            </div>
            <div class="form-group">
                <label>O'qituvchi</label>
                <input type="text" id="m-teacher" placeholder="F.I.O">
            </div>
            <div class="modal-actions">
                <button class="btn btn-clear" onclick="clearCell()">O'chirish</button>
                <button class="btn btn-cancel" onclick="closeModal()">Bekor qilish</button>
                <button class="btn btn-save" onclick="saveCell()">Saqlash</button>
            </div>
        </div>
    </div>

    <script>
        const times = ['09:00 - 10:20', '10:30 - 11:50', '12:10 - 13:30', '13:40 - 15:00', '15:10 - 16:30'];
        let scheduleData = Array(5).fill().map(() => Array(7).fill(null));
        let currentRow = -1, currentCol = -1;

        function renderTable() {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                const tr = document.createElement('tr');
                
                const tdJuftlik = document.createElement('td');
                tdJuftlik.className = 'juftlik-col';
                tdJuftlik.textContent = `${i + 1}-juftlik`;
                tr.appendChild(tdJuftlik);

                for (let j = 0; j < 7; j++) {
                    const td = document.createElement('td');
                    td.className = 'editable-cell';
                    td.title = "Tahrirlash uchun bosing";
                    td.onclick = () => openModal(i, j);
                    
                    const data = scheduleData[i][j];
                    if (data && data.subject) {
                        td.innerHTML = `
                            <div class="subject">${data.subject}</div>
                            <div class="time">${data.time}</div>
                            ${data.room ? `<div class="room">Xona: ${data.room}</div>` : ''}
                            ${data.teacher ? `<div class="teacher">${data.teacher}</div>` : ''}
                        `;
                    } else {
                        td.innerHTML = `<div class="empty">Dars yo'q</div>`;
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        function openModal(r, c) {
            currentRow = r;
            currentCol = c;
            const data = scheduleData[r][c] || { subject: '', time: times[r], room: '', teacher: '' };
            
            document.getElementById('m-subject').value = data.subject || '';
            document.getElementById('m-time').value = data.time || times[r];
            document.getElementById('m-room').value = data.room || '';
            document.getElementById('m-teacher').value = data.teacher || '';
            
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function saveCell() {
            const subject = document.getElementById('m-subject').value.trim();
            if (subject) {
                scheduleData[currentRow][currentCol] = {
                    subject: subject,
                    time: document.getElementById('m-time').value.trim(),
                    room: document.getElementById('m-room').value.trim(),
                    teacher: document.getElementById('m-teacher').value.trim()
                };
            } else {
                scheduleData[currentRow][currentCol] = null;
            }
            closeModal();
            renderTable();
        }

        function clearCell() {
            scheduleData[currentRow][currentCol] = null;
            closeModal();
            renderTable();
        }

        function downloadPNG() {
            const captureArea = document.getElementById('capture-area');
            const downloadBtn = document.querySelector('.btn-download');
            
            downloadBtn.textContent = 'Yuklanmoqda...';
            downloadBtn.style.opacity = '0.7';

            html2canvas(captureArea, {
                scale: 2,
                backgroundColor: '#f0f4f8',
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                const groupName = document.querySelector('.header-title').innerText.replace(/[^a-zA-Z0-9-]/g, '_');
                link.download = `${groupName}_dars_jadvali.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                downloadBtn.textContent = '↓ PNG formatida yuklab olish';
                downloadBtn.style.opacity = '1';
            });
        }

        window.onload = renderTable;
    </script>
</body>
</html>
"""

with open('index.html', 'w', encoding='utf-8') as f:
    f.write(html_code)
